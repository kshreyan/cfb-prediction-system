[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb"
version = "0.1.0"
description = "Honestly-backtested college football prediction system (moneyline, spread, total)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "cfbd>=5.6,<6",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.5,<5",
    "statsmodels>=0.14,<1",
    # Pinned to v1 because the cfbd SDK (5.x) requires pydantic<2.
    "pydantic>=1.10.5,<2",
    "pyyaml>=6.0,<7",
    "structlog>=24.1,<25",
    "tenacity>=9.0,<10",
    "click>=8.1,<9",
    "jinja2>=3.1,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "hypothesis>=6.108,<7",
    "mypy>=1.11,<2",
    "types-PyYAML>=6.0,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
cfb = "cfb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Naive datetimes are fine in test fixtures (calendar dates for game
# ordering, not real timestamps).
"tests/**" = ["DTZ001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
