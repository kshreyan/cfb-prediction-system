name: Weekly refresh

# Regenerates predictions for the upcoming week and rebuilds the static
# site, then commits the result back to main. INERT until CFBD_API_KEY is
# added as a repo secret (Settings -> Secrets and variables -> Actions) --
# without it, `cfb predict` fails fast with a clear "BLOCKED" message
# rather than silently doing nothing. Also requires GitHub Pages to be
# enabled (Settings -> Pages -> Deploy from branch -> main /docs) for the
# rebuilt site to actually be served anywhere.
#
# Schedule: Wednesdays 12:00 UTC -- after most books have posted lines
# for that week's games but with enough runway before kickoff for the
# snapshot to be useful. Manually triggerable via workflow_dispatch too.

on:
  schedule:
    - cron: "0 12 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate this week's predictions
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m cfb.cli predict
      - name: Rebuild static site
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m cfb.cli report --out docs
      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Weekly refresh: rebuild predictions + site"
          git push
