# Conference -> tier mapping, used only for (a) offseason Elo regression priors
# and (b) FBS/FCS + power/group-of-five flags on features and reports.
# This is NOT a source of truth for team results — CFBD's `conference` field
# on each game/team record (as-of the season in question) is authoritative and
# will override this file in production. This file supplies the *prior* used
# before a team has played, and is applied per-season so realignment is
# reflected as conferences change year to year.
#
# tier_priors are Elo rating means (base rating = 1500) that offseason
# regression pulls each team's rating partway toward. Values are a modeling
# choice, not a measured fact -- they should be recalibrated against
# historical outcomes as data comes in, not treated as ground truth.

base_rating: 1500.0

tier_priors:
  power: 1620.0        # SEC, Big Ten, Big 12, ACC
  independent_fbs: 1560.0   # Notre Dame and other major independents
  group_of_five: 1440.0     # AAC, Mountain West, Sun Belt, MAC, Conference USA
  fcs: 1250.0               # FBS opponents outside Division I FBS

conferences:
  power:
    - SEC
    - Big Ten
    - Big 12
    - ACC
  independent_fbs:
    - FBS Independents
  group_of_five:
    - American Athletic
    - Mountain West
    - Sun Belt
    - Mid-American
    - Conference USA
  # Anything not listed above and not flagged FBS in CFBD's team data is
  # treated as FCS/other and gets the fcs prior + an is_fbs=False flag.
